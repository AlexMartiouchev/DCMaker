{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}DCMaker{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
    <style>
        :root {
            --bg: #16151c; --panel: #211f2b; --edge: #35323f;
            --text: #e8e5f0; --dim: #9b96ab; --accent: #b08d57;
            --leadership: #b0574f; --officer: #b08d57; --member: #6f8f6a; --mob: #5b7a99;
        }
        * { box-sizing: border-box; margin: 0; }
        body { background: var(--bg); color: var(--text); font-family: Georgia, serif; line-height: 1.5; }
        header { padding: 0.8rem 1.5rem; border-bottom: 1px solid var(--edge); display: flex; gap: 1rem; align-items: baseline; }
        header a { color: var(--accent); text-decoration: none; font-size: 1.2rem; }
        .crumbs { color: var(--dim); font-size: 0.9rem; }
        .crumbs a { color: var(--dim); font-size: 0.9rem; }
        main { max-width: 65rem; margin: 0 auto; padding: 1.5rem; }
        h1 { font-size: 1.6rem; margin-bottom: 0.2rem; }
        h2 { font-size: 1.1rem; margin: 1.5rem 0 0.6rem; color: var(--accent); }
        .sub { color: var(--dim); margin-bottom: 1rem; }
        .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: 0.8rem; }
        .card { background: var(--panel); border: 1px solid var(--edge); border-radius: 6px; padding: 0.9rem; }
        .card a { color: var(--text); text-decoration: none; font-weight: bold; }
        .card .meta { color: var(--dim); font-size: 0.85rem; margin: 0.15rem 0 0.4rem; }
        .card p { font-size: 0.9rem; }
        .card.empty { border-style: dashed; color: var(--dim); display: flex; align-items: center; justify-content: center; min-height: 6rem; }
        .badge { display: inline-block; font-size: 0.72rem; padding: 0.1rem 0.45rem; border-radius: 999px; color: #fff; }
        .badge.leadership { background: var(--leadership); } .badge.officer { background: var(--officer); }
        .badge.member { background: var(--member); } .badge.mob { background: var(--mob); }
        .badge.legendary { background: #7a4fb0; }
        .chip { display: inline-block; font-size: 0.78rem; background: var(--bg); border: 1px solid var(--edge); border-radius: 999px; padding: 0.05rem 0.5rem; margin: 0.1rem 0.1rem 0 0; color: var(--dim); }
        .stats { font-size: 0.82rem; color: var(--dim); margin-top: 0.4rem; }
        details { margin-top: 0.4rem; font-size: 0.85rem; }
        details summary { cursor: pointer; color: var(--dim); }
        .cardtop { display: flex; gap: 0.7rem; }
        .portrait { flex: 0 0 4rem; height: 4rem; background: var(--bg); border: 1px dashed var(--edge);
                    border-radius: 6px; display: flex; flex-direction: column; align-items: center;
                    justify-content: center; font-size: 1.2rem; }
        .portrait span { font-size: 0.55rem; color: var(--dim); }
        .vitals { font-weight: bold; font-size: 0.95rem; margin-top: 0.2rem; color: var(--accent); }
        .statgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.2rem;
                    margin-top: 0.5rem; font-size: 0.72rem; color: var(--dim); text-align: center; }
        .statgrid span { background: var(--bg); border: 1px solid var(--edge); border-radius: 4px; padding: 0.15rem 0; }
        details.panel { border-top: 1px solid var(--edge); padding-top: 0.35rem; margin-top: 0.55rem; }
        details.panel p { margin: 0.35rem 0 0; font-size: 0.85rem; }
        .effect { background: var(--bg); border: 1px solid var(--edge); border-left: 3px solid var(--dim);
                  border-radius: 5px; padding: 0.45rem 0.6rem; margin-top: 0.45rem; font-size: 0.83rem;
                  transition: border-color 0.15s; }
        .effect:hover { border-color: var(--accent); cursor: pointer; }  /* future: click to roll */
        .effect.action { border-left-color: var(--leadership); }
        .effect.ability { border-left-color: var(--member); }
        .effect.legendary { border-left-color: #7a4fb0; }
        .effecthead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.15rem; }
        .effecthead .kind { font-size: 0.68rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.05em; }
        .slotform { flex-direction: column; gap: 0.5rem; padding: 0.9rem; }
        .slotform textarea { width: 100%; background: var(--bg); border: 1px solid var(--edge);
                             border-radius: 4px; color: var(--text); font-family: inherit;
                             font-size: 0.85rem; padding: 0.4rem; resize: vertical; }
        .slotform button { background: var(--accent); color: var(--bg); border: none; border-radius: 4px;
                           padding: 0.4rem 0.9rem; font-family: inherit; font-weight: bold; cursor: pointer; }
        .slotform button:disabled { opacity: 0.5; cursor: wait; }
        .htmx-indicator { display: none; color: var(--accent); font-style: italic; font-size: 0.85rem; }
        .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { display: inline; }
        .card.plus { border-style: dashed; color: var(--dim); }
        .card.plus summary { cursor: pointer; list-style: none; text-align: center;
                             font-size: 1.6rem; line-height: 2.2rem; }
        .card.plus[open] summary { text-align: left; font-size: 1rem; }
        .card.plus form { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.4rem; }
        .slotform input[type="text"], .slotform input[type="number"] {
            background: var(--bg); border: 1px solid var(--edge); border-radius: 4px;
            color: var(--text); font-family: inherit; font-size: 0.85rem; padding: 0.4rem; }
        .del { background: none; border: none; color: var(--dim); cursor: pointer;
               font-size: 0.9rem; float: right; padding: 0 0.2rem; }
        .del:hover { color: var(--leadership); }
        .dangerbtn { background: none; border: 1px solid var(--leadership); color: var(--leadership);
                     border-radius: 4px; padding: 0.3rem 0.7rem; font-family: inherit;
                     font-size: 0.85rem; cursor: pointer; }
        .dangerbtn:hover { background: var(--leadership); color: #fff; }
        .toolbar { display: flex; gap: 0.6rem; align-items: center; margin: 0.8rem 0; }
        .toolbar .accentbtn { background: var(--accent); color: var(--bg); border: none;
                              border-radius: 4px; padding: 0.35rem 0.8rem; font-family: inherit;
                              font-weight: bold; cursor: pointer; }
        .userbox { margin-left: auto; display: flex; gap: 0.7rem; align-items: baseline;
                   font-size: 0.85rem; color: var(--dim); }
        .userbox a { font-size: 0.85rem; }
        .linkbtn { background: none; border: none; color: var(--dim); font-family: inherit;
                   font-size: 0.85rem; cursor: pointer; padding: 0; text-decoration: underline; }
        .linkbtn:hover { color: var(--accent); }
        .authcard { max-width: 22rem; margin: 3rem auto; background: var(--panel);
                    border: 1px solid var(--edge); border-radius: 6px; padding: 1.5rem; }
        .authform { display: flex; flex-direction: column; gap: 0.35rem; margin: 1rem 0; }
        .authform label { font-size: 0.85rem; color: var(--dim); margin-top: 0.4rem; }
        .authform input { background: var(--bg); border: 1px solid var(--edge); border-radius: 4px;
                          color: var(--text); font-family: inherit; font-size: 0.95rem;
                          padding: 0.45rem; width: 100%; }
        .authform button { background: var(--accent); color: var(--bg); border: none;
                           border-radius: 4px; padding: 0.5rem; font-family: inherit;
                           font-weight: bold; font-size: 0.95rem; cursor: pointer;
                           margin-top: 1rem; }
        .authform .hint, .authform ul { color: var(--dim); font-size: 0.75rem; margin: 0.1rem 0 0; }
        .authform .hint li { margin-left: 1rem; }
        .formerror { color: var(--leadership); font-size: 0.8rem; margin: 0.15rem 0 0; }
        #toasts { position: fixed; right: 1rem; bottom: 1rem; z-index: 50;
                  display: flex; flex-direction: column; gap: 0.5rem; max-width: 26rem; }
        .toast { background: var(--panel); border: 1px solid var(--leadership);
                 border-left-width: 4px; border-radius: 5px; padding: 0.7rem 0.9rem;
                 font-size: 0.88rem; box-shadow: 0 4px 14px rgba(0,0,0,0.45);
                 display: flex; gap: 0.7rem; align-items: flex-start; }
        .toast button { background: none; border: none; color: var(--dim);
                        cursor: pointer; font-size: 1rem; line-height: 1; padding: 0;
                        margin-left: auto; }
        .toast button:hover { color: var(--text); }
    </style>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <header>
        <a href="{% url 'campaign_list' %}">⚔ DCMaker</a>
        <span class="crumbs">{% block crumbs %}{% endblock %}</span>
        <span class="userbox">
            {% if user.is_authenticated %}
                <span>{{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="linkbtn">Sign out</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Sign in</a>
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </span>
    </header>
    <main>{% block content %}{% endblock %}</main>

    <div id="toasts" aria-live="polite"></div>
    <script>
        // htmx swaps nothing on a non-2xx response, so without this a
        // failed generation is completely silent: the button un-disables
        // and the DM has no idea whether anything happened.
        function toast(message) {
            const box = document.createElement('div');
            box.className = 'toast';
            const text = document.createElement('span');
            // textContent, not innerHTML — the body is server text and
            // could contain markup we do not want executed.
            text.textContent = message;
            const close = document.createElement('button');
            close.textContent = '✕';
            close.setAttribute('aria-label', 'Dismiss');
            close.onclick = () => box.remove();
            box.append(text, close);
            document.getElementById('toasts').append(box);
            setTimeout(() => box.remove(), 12000);
        }

        document.body.addEventListener('htmx:responseError', (event) => {
            const xhr = event.detail.xhr;
            const body = (xhr.responseText || '').trim();
            // Django's debug page is HTML and megabytes long; only show
            // the body when it is the short plain message we sent.
            const usable = body && body.length < 300 && !body.startsWith('<');
            toast(usable ? body : `Something went wrong (${xhr.status}). Nothing was saved.`);
        });

        document.body.addEventListener('htmx:sendError', () => {
            toast('Could not reach the server. Check your connection and try again.');
        });
    </script>
</body>
</html>
